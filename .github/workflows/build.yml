name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/Yamada0001/twrp_device_xiaomi_sm8850"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "xiaomi/sm8850"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "sm8850"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 10G
      SYNC_JOBS: 12
      BUILD_JOBS: 2
      DEVICE_PATH_INPUT: ${{ github.event.inputs.DEVICE_PATH }}
      DEVICE_NAME_INPUT: ${{ github.event.inputs.DEVICE_NAME }}
      LUNCH_INPUT: ${{ github.event.inputs.LUNCH_TARGET }}
      BUILD_PARTITION_INPUT: ${{ github.event.inputs.BUILD_PARTITION }}
    steps:
    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y repo ccache bc bison build-essential curl flex g++-multilib gcc-multilib git-lfs imagemagick libncurses5-dev libssl-dev libxml2-utils lz4 openjdk-17-jdk python3 rsync schedtool squashfs-tools unzip zip zstd
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Configure build swap
      run: |
        set -euo pipefail
        sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc 2>/dev/null || true
        df -h
        sudo fallocate -l 4G /mnt/build.swap
        sudo chmod 600 /mnt/build.swap
        sudo mkswap /mnt/build.swap
        sudo swapon /mnt/build.swap
        free -h

    - name: Restore repo cache
      uses: actions/cache/restore@v4
      with:
        path: .repo
        key: twrp-repo-${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          twrp-repo-${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}-

    - name: Sync source
      run: |
        set -euo pipefail
        manifest_url='${{ github.event.inputs.TWRP_MANIFEST_URL }}'
        manifest_url="${manifest_url//\&amp;/\&}"
        manifest_url="${manifest_url#\[}"
        manifest_url="${manifest_url%%\]*}"
        repo init -u "$manifest_url" -b '${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}' --depth=1
        manifest_hash=$(sha256sum .repo/manifests/default.xml | cut -d' ' -f1)
        echo "MANIFEST_HASH=${manifest_hash}" >> "$GITHUB_ENV"
        (while sleep 30; do echo "repo sync still running: $(date -u +%T)"; done) &
        heartbeat=$!
        trap 'kill "$heartbeat" 2>/dev/null || true' EXIT
        repo sync -c -j${SYNC_JOBS} --no-clone-bundle --no-tags --optimized-fetch --fail-fast

    - name: Reclaim memory after source sync
      run: |
        set -euo pipefail
        sync
        sudo sysctl -w vm.drop_caches=3 || true
        if sudo swapon --show=NAME --noheadings | grep -q '^/mnt/build.swap$'; then
          sudo swapoff /mnt/build.swap || true
          sudo swapon /mnt/build.swap || true
        fi
        free -h
        df -h

    - name: Save repo cache
      uses: actions/cache@v4
      with:
        path: .repo
        key: twrp-repo-${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}-${{ github.run_id }}

    - name: Restore build output cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .ccache
          .soong_cache
        key: twrp-build-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-v1

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Prepare build environment
      working-directory: ${{ github.workspace }}
      run: |
        set -eo pipefail
        set -x
        echo "workspace=$PWD"
        test -f build/envsetup.sh
        test -d "device/${DEVICE_PATH_INPUT}"
        source build/envsetup.sh
        export CCACHE_EXEC="$(command -v ccache)"
        lunch_target="$LUNCH_INPUT"
        if [ -z "$lunch_target" ]; then
          lunch_target="$DEVICE_NAME_INPUT"
        fi
        echo "LUNCH_TARGET_RESOLVED=$lunch_target" >> "$GITHUB_ENV"

    - name: Select TWRP product
      working-directory: ${{ github.workspace }}
      run: |
        set -eo pipefail
        set -x
        source build/envsetup.sh
        lunch "twrp_${LUNCH_TARGET_RESOLVED}"
        target_product="$(get_build_var TARGET_PRODUCT)"
        test "$target_product" = "twrp_${LUNCH_TARGET_RESOLVED}"
        echo "TARGET_PRODUCT=$target_product"

    - name: Build recovery image
      working-directory: ${{ github.workspace }}
      run: |
        set -eo pipefail
        set -x
        source build/envsetup.sh
        lunch "twrp_${LUNCH_TARGET_RESOLVED}"
        (while sleep 30; do echo "build still running: $(date -u +%T)"; free -h; done) &
        heartbeat=$!
        trap 'kill "$heartbeat" 2>/dev/null || true' EXIT
        mkdir -p .soong_cache
        ln -sfn "$PWD/out/soong" .soong_cache/soong
        m "${BUILD_PARTITION_INPUT}image" -j${BUILD_JOBS}
        mv "out/target/product/${DEVICE_NAME_INPUT}/${BUILD_PARTITION_INPUT}.img" "out/target/product/${DEVICE_NAME_INPUT}/TWRP-3.7.1-16-${DEVICE_NAME_INPUT}-${BUILD_DATE}.img"

    - name: Save build output cache
      if: always()
      uses: actions/cache@v4
      with:
        path: |
          .ccache
          .soong_cache
        key: twrp-build-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-v1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
